# Ejemplo avanzado: checks variados, alertas, notificaciones y auth opcional
bind = "0.0.0.0"
port = 9090
db_path = "/var/lib/tinytop/tinytop.db"
interval_seconds = 30
retention_hours = 168
request_timeout_secs = 5
max_history_hours = 168

# Auth opcional (protege API/dashboard; /api/health puede quedar exento según config)
# [auth]
# token = "cambia-este-token"            # Bearer / X-API-Key (o ?token= legado, desaconsejado)
# # basic_user = "admin"                 # alternativa/complemento: Basic auth
# # basic_password = "cambia-esta-clave"
# allow_health_unauth = true

# Umbrales/alertas (ajusta a tu entorno)
[alerts]
enabled = true
cpu_percent_warn = 90.0
mem_percent_warn = 90.0
disk_percent_warn = 90.0
target_latency_ms_warn = 1500.0
cert_expiry_days_warn = 14

# Notificaciones best-effort ante transiciones (configura las que uses)
# [notifications]
# webhook_url = "https://hooks.example.com/tinytop"   # webhook genérico; si es de Discord, envía payload compatible (content)
# # webhook_url = "https://discord.com/api/webhooks/<id>/<token>"  # Discord (incoming webhook)
# telegram_bot_token = "123456:ABC..."
# telegram_chat_id = "-100123456"
# ntfy_url = "https://ntfy.sh"
# ntfy_topic = "mi-topic"
# cooldown_secs = 300
# notify_on_firing = true
# notify_on_resolve = true

# Targets HTTP (integraciones compatibles)
[[targets]]
name = "spring-local"
url = "http://localhost:8080/actuator/health"
kind = "spring-boot"
check_type = "http"

[[targets]]
name = "api-health"
url = "https://api.example.com/health"
kind = "generic"
check_type = "http"

# Checks TCP
[[targets]]
name = "postgres"
check_type = "tcp"
url = ""
host = "db.internal"
port = 5432

# Checks ping (best-effort, requiere `ping`)
[[targets]]
name = "gateway"
check_type = "ping"
url = ""
host = "10.0.0.1"

# Checks TLS (handshake + días de cert, best-effort, requiere `openssl`)
[[targets]]
name = "edge-tls"
check_type = "tls"
url = ""
host = "example.com"
port = 443
