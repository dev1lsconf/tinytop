name: Docker Edge

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build, smoke test and push edge image
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge
            type=sha,format=long,prefix=sha-

      - name: Build image for smoke test (amd64)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: tinytop:edge-test
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge

      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tt-edge
          cat > /tmp/tt-edge/config.toml <<'CFG'
          bind = "0.0.0.0"
          port = 9090
          db_path = "/app/data/tinytop.db"
          interval_seconds = 2
          retention_hours = 24
          max_history_hours = 24
          request_timeout_secs = 5
          CFG
          docker run -d --name tinytop-edge-test \
            -v /tmp/tt-edge/config.toml:/app/config.toml:ro \
            -e TINYTOP_CONFIG=/app/config.toml \
            -e TINYTOP_DB_PATH=/app/data/tinytop.db \
            -p 19090:9090 \
            tinytop:edge-test
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:19090/api/health >/tmp/tt-edge/health.json 2>/dev/null; then
              ok=1; break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "smoke test failed: server did not start"
            docker logs tinytop-edge-test || true
            exit 1
          fi
          sleep 3
          curl -fsS http://127.0.0.1:19090/api/health | tee /tmp/tt-edge/health.json
          curl -fsS http://127.0.0.1:19090/api/metrics/latest | tee /tmp/tt-edge/latest.json
          grep -q '"db"' /tmp/tt-edge/health.json
          grep -q '"system"' /tmp/tt-edge/latest.json
          docker rm -f tinytop-edge-test || true

      - name: Build and push multi-arch edge image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge
