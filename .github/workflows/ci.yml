name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --locked --all-targets || cargo check --all-targets

      - name: Cargo build (release)
        run: cargo build --release

  e2e:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build server
        run: cargo build --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci || npm install; else npm install; fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start TinyTop server
        run: |
          ./target/release/tinytop > tinytop.log 2>&1 &
          echo $! > tinytop.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9090/api/health >/dev/null; then
              echo "Server is up"; exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          cat tinytop.log || true
          exit 1
        env:
          TINYTOP_CONFIG: ./config.toml

      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          CI: "true"
          BASE_URL: http://localhost:9090

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinytop-log
          path: tinytop.log
          if-no-files-found: ignore

      - name: Stop server
        if: always()
        run: |
          if [ -f tinytop.pid ]; then kill "$(cat tinytop.pid)" || true; fi
