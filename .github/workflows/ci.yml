name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --all-targets --locked

      - name: Build (release)
        run: cargo build --release --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.21.2 || cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

  e2e:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.88"

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build server
        run: cargo build --release --locked

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci || npm install; else npm install; fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start TinyTop server
        run: |
          mkdir -p data
          ./target/release/tinytop > tinytop.log 2>&1 &
          echo $! > tinytop.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9090/api/health >/dev/null; then
              echo "Server is up"; exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          cat tinytop.log || true
          exit 1
        env:
          TINYTOP_CONFIG: ./tests/e2e.config.toml
          TINYTOP_DB_PATH: ./data/tinytop.db
          TINYTOP_INTERVAL: "2"
          TINYTOP_RETENTION_HOURS: "24"

      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          CI: "true"
          BASE_URL: http://localhost:9090

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tinytop-log
          path: tinytop.log
          if-no-files-found: ignore

      - name: Stop server
        if: always()
        run: |
          if [ -f tinytop.pid ]; then kill "$(cat tinytop.pid)" || true; fi


  docker-smoke:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Build image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          load: true
          tags: tinytop:ci
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,mode=max,scope=ci-docker

      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tt-ci
          cat > /tmp/tt-ci/config.toml <<'CFG'
          bind = "0.0.0.0"
          port = 9090
          db_path = "/app/data/tinytop.db"
          interval_seconds = 2
          retention_hours = 24
          max_history_hours = 24
          request_timeout_secs = 5
          CFG
          docker run -d --name tinytop-ci \
            -v /tmp/tt-ci/config.toml:/app/config.toml:ro \
            -e TINYTOP_CONFIG=/app/config.toml \
            -e TINYTOP_DB_PATH=/app/data/tinytop.db \
            -p 19091:9090 \
            tinytop:ci
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:19091/api/health >/tmp/tt-ci/health.json 2>/dev/null; then
              ok=1; break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "container failed to start"
            docker logs tinytop-ci || true
            exit 1
          fi
          sleep 3
          curl -fsS http://127.0.0.1:19091/api/health | tee /tmp/tt-ci/health.json
          curl -fsS http://127.0.0.1:19091/api/metrics/latest | tee /tmp/tt-ci/latest.json
          grep -q '"db"' /tmp/tt-ci/health.json
          grep -q '"system"' /tmp/tt-ci/latest.json
          docker rm -f tinytop-ci || true
