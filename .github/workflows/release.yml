name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release a publicar (ej. v0.0.5)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  linux-binaries:
    name: Linux binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            arch_label: linux-x86_64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            arch_label: linux-aarch64
            use_cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            arch_label: linux-x86_64-musl
            use_cross: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set version
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "archive=tinytop-${TAG}-${{ matrix.arch_label }}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install host deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libsqlite3-dev

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked || cargo install cross --locked

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package binary artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tinytop dist/tinytop
          cp config.toml dist/config.toml
          cp -r static dist/static
          cp -r migrations dist/migrations
          tar -czf "${{ steps.vars.outputs.archive }}" -C dist tinytop config.toml static migrations
          sha256sum "${{ steps.vars.outputs.archive }}" > "${{ steps.vars.outputs.archive }}.sha256"

      - name: Build native packages (.deb/.rpm)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-deb --locked || cargo install cargo-deb
          cargo install cargo-generate-rpm --locked || cargo install cargo-generate-rpm
          cargo deb --no-build --target ${{ matrix.target }}
          cargo generate-rpm --target ${{ matrix.target }}

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          ARCHIVE: ${{ steps.vars.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          FILES=("$ARCHIVE" "$ARCHIVE.sha256")
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            shopt -s nullglob
            FILES+=(target/${{ matrix.target }}/debian/*.deb target/${{ matrix.target }}/generate-rpm/*.rpm)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "TinyTop $TAG" \
              --generate-notes
          fi

  docker:
    name: Multi-arch container image
    needs: linux-binaries
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set version
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest

      - name: Build and push multi-arch container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bsd-freebsd:
    name: BSD release artifacts (freebsd)
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Set version
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="${{ inputs.tag }}"; else TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "archive=tinytop-${TAG}-freebsd-x86_64.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Build release binary (freebsd)
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y curl pkgconf sqlite3 bash
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain 1.88
          run: |
            set -e
            . "$HOME/.cargo/env"
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo build --release --locked
            mkdir -p dist
            cp target/release/tinytop dist/tinytop
            cp config.toml dist/config.toml
            cp -r static dist/static
            cp -r migrations dist/migrations
            ARCHIVE="${{ steps.vars.outputs.archive }}"
            tar -czf "$ARCHIVE" -C dist tinytop config.toml static migrations
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"; else sha256 -r "$ARCHIVE" | awk '{print $1"  "$2}' > "$ARCHIVE.sha256"; fi
      - name: Upload BSD artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          ARCHIVE: ${{ steps.vars.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber

  bsd-openbsd:
    name: BSD release artifacts (openbsd)
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Set version
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="${{ inputs.tag }}"; else TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "archive=tinytop-${TAG}-openbsd-x86_64.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Build release binary (openbsd)
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg_add bash sqlite3 rust
          run: |
            set -e
            export PATH="/usr/local/bin:$PATH"
            rustc --version
            cargo --version
            cargo build --release --locked
            mkdir -p dist
            cp target/release/tinytop dist/tinytop
            cp config.toml dist/config.toml
            cp -r static dist/static
            cp -r migrations dist/migrations
            ARCHIVE="${{ steps.vars.outputs.archive }}"
            tar -czf "$ARCHIVE" -C dist tinytop config.toml static migrations
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"; else sha256 "$ARCHIVE" > "$ARCHIVE.sha256"; fi
      - name: Upload BSD artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          ARCHIVE: ${{ steps.vars.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber

  bsd-netbsd:
    name: BSD release artifacts (netbsd)
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Set version
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="${{ inputs.tag }}"; else TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "archive=tinytop-${TAG}-netbsd-x86_64.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Build release binary (netbsd)
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: |
            /usr/sbin/pkg_add curl pkgconf sqlite3 bash mozilla-rootcerts || pkg_add curl pkgconf sqlite3 bash || true
            /usr/sbin/mozilla-rootcerts install || true
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain 1.88
          run: |
            set -e
            . "$HOME/.cargo/env"
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo build --release --locked
            mkdir -p dist
            cp target/release/tinytop dist/tinytop
            cp config.toml dist/config.toml
            cp -r static dist/static
            cp -r migrations dist/migrations
            ARCHIVE="${{ steps.vars.outputs.archive }}"
            tar -czf "$ARCHIVE" -C dist tinytop config.toml static migrations
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"; else sha256 "$ARCHIVE" > "$ARCHIVE.sha256"; fi
      - name: Upload BSD artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          ARCHIVE: ${{ steps.vars.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
