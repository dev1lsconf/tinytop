name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release a publicar (ej. v0.0.4)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  linux:
    name: Linux release and container package
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set version
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "archive=tinytop-${TAG}-linux-x86_64.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libsqlite3-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/tinytop dist/tinytop
          cp config.toml dist/config.toml
          cp -r static dist/static
          cp -r migrations dist/migrations
          tar -czf "${{ steps.vars.outputs.archive }}" -C dist tinytop config.toml static migrations
          sha256sum "${{ steps.vars.outputs.archive }}" > "${{ steps.vars.outputs.archive }}.sha256"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          ARCHIVE: ${{ steps.vars.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
              --title "TinyTop $TAG" \
              --generate-notes
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bsd:
    name: BSD release artifacts (${{ matrix.os }})
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: freebsd
            vm: vmactions/freebsd-vm@v1
            prepare: |
              pkg install -y curl pkgconf sqlite3 bash
              curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain 1.88
            sha_cmd: 'if command -v sha256sum >/dev/null 2>&1; then sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"; else sha256 -r "$ARCHIVE" | awk "{print \$1\"  \"\$2}" > "$ARCHIVE.sha256"; fi'
          - os: openbsd
            vm: vmactions/openbsd-vm@v1
            prepare: |
              pkg_add curl pkgconf sqlite3 bash
              curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain 1.88
            sha_cmd: 'if command -v sha256sum >/dev/null 2>&1; then sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"; else sha256 "$ARCHIVE" > "$ARCHIVE.sha256"; fi'
          - os: netbsd
            vm: vmactions/netbsd-vm@v1
            prepare: |
              /usr/sbin/pkg_add curl pkgconf sqlite3 bash mozilla-rootcerts || pkg_add curl pkgconf sqlite3 bash || true
              /usr/sbin/mozilla-rootcerts install || true
              curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain 1.88
            sha_cmd: 'if command -v sha256sum >/dev/null 2>&1; then sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"; else sha256 "$ARCHIVE" > "$ARCHIVE.sha256"; fi'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set version
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "archive=tinytop-${TAG}-${{ matrix.os }}-x86_64.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Build release binary (${{ matrix.os }})
        uses: ${{ matrix.vm }}
        with:
          usesh: true
          prepare: ${{ matrix.prepare }}
          run: |
            set -e
            . "$HOME/.cargo/env"
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo build --release --locked
            mkdir -p dist
            cp target/release/tinytop dist/tinytop
            cp config.toml dist/config.toml
            cp -r static dist/static
            cp -r migrations dist/migrations
            ARCHIVE="${{ steps.vars.outputs.archive }}"
            tar -czf "$ARCHIVE" -C dist tinytop config.toml static migrations
            ${{ matrix.sha_cmd }}

      - name: Upload BSD artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          ARCHIVE: ${{ steps.vars.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
