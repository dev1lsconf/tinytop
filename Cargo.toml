[package]
name = "tinytop"
version = "1.0.1"
edition = "2024"
description = "Lightweight self-hosted system and target monitor (single binary, SQLite, web dashboard and TUI)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dev1lsconf/tinytop"
homepage = "https://github.com/dev1lsconf/tinytop"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
base64 = "0.22"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[package.metadata.deb]
maintainer = "TinyTop Contributors <noreply@commandcode.ai>"
copyright = "2026, TinyTop Contributors"
license-file = ["LICENSE", "0"]
extended-description = "TinyTop - lightweight self-hosted system and target monitor (single binary, SQLite, web dashboard and TUI)."
section = "utils"
priority = "optional"
assets = [
  ["target/release/tinytop", "usr/bin/", "755"],
  ["config.toml", "etc/tinytop/config.toml", "644"],
  ["README.md", "usr/share/doc/tinytop/README.md", "644"],
  ["CHANGELOG.md", "usr/share/doc/tinytop/CHANGELOG.md", "644"],
  ["LICENSE", "usr/share/doc/tinytop/LICENSE", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/tinytop", dest = "/usr/bin/tinytop", mode = "755" },
  { source = "config.toml", dest = "/etc/tinytop/config.toml", mode = "644", config = true },
  { source = "README.md", dest = "/usr/share/doc/tinytop/README.md", mode = "644", doc = true },
  { source = "CHANGELOG.md", dest = "/usr/share/doc/tinytop/CHANGELOG.md", mode = "644", doc = true },
  { source = "LICENSE", dest = "/usr/share/doc/tinytop/LICENSE", mode = "644", doc = true },
]
